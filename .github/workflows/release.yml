# Auto-release on merge to main
#
# The version is the one Cargo.toml declares when it is ahead of every
# released version (a minor or major release is declared on dev), and the
# next patch otherwise. scripts/version.sh has the rule; no version is ever
# released twice.
#
# Bumps Cargo.toml, generates CHANGELOG.md via git-cliff, commits, and pushes.
# The tag is created via the GitHub API with a PAT so it triggers the existing
# CI workflow for testing and package publishing.
#
# Release tags are immutable: a ruleset blocks deleting or moving v* tags. If
# the tag's CI fails, its version stays without a release and the fix ships as
# the next version.
#
# Commit push uses GITHUB_TOKEN (no workflow triggers).
# Tag creation uses RELEASE_PAT (triggers on:push:tags workflows).

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: Bump Version & Tag
    runs-on: ubuntu-latest
    # Only main releases: version.sh reads released versions from the branch's
    # own history, so a dispatch on another branch could re-cut a version.
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' ||
        !startsWith(github.event.head_commit.message, 'chore(release)')
      )
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Force-refresh tags
        run: git fetch origin --tags --force

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --version

      - name: Determine next version
        id: version
        run: |
          source scripts/version.sh
          BRANCH="${GITHUB_REF#refs/heads/}"
          release_version
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null; then
            echo "::error::$TAG_NAME already exists; a released version is never re-cut"
            exit 1
          fi
          echo "NEXT_VERSION=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "BRANCH=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT_VERSION (tag: $TAG_NAME) [branch: $BRANCH]"

      - name: Update Cargo.toml version
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"${{ steps.version.outputs.NEXT_VERSION }}\"/" Cargo.toml

      # Syncs this package's version only. Regenerating would re-resolve every
      # dependency, shipping a set no CI run built.
      - name: Update Cargo.lock
        run: cargo update --workspace

      - name: Generate CHANGELOG
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.version.outputs.TAG_NAME }} -o CHANGELOG.md

      - name: Commit release
        run: |
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.NEXT_VERSION }}"

      - name: Push commits (GITHUB_TOKEN — no workflow triggers)
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin ${{ steps.version.outputs.BRANCH }}

      - name: Create tag via API (PAT — triggers downstream CI)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const tagName = '${{ steps.version.outputs.TAG_NAME }}';

            // Get the SHA of the release commit (HEAD after our commits)
            const { execSync } = require('child_process');
            const commitSha = execSync('git rev-parse HEAD').toString().trim();

            // Create annotated tag object
            const tagObject = await github.rest.git.createTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName,
              message: `Release ${tagName}`,
              object: commitSha,
              type: 'commit'
            });

            // Create tag reference
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tagName}`,
              sha: tagObject.data.sha
            });

            console.log(`Created tag ${tagName} -> ${commitSha}`);
