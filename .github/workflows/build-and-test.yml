name: Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags: "v**"
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The node the client is developed against. A red run here is re-run against
  # the previous immutable dev-v...-g<sha> tag: green there means the node
  # changed, not the client. The job records the digest it pulled, because the
  # node's own /api/status cannot identify its build (f1r3node-rust#428).
  FIREFLY_NODE_IMAGE: f1r3flyindustries/f1r3fly-rust:dev

jobs:
  # Format and lint checks: fast, runs in parallel with build_base.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release)')
      || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-06-15
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compiler warnings
        env:
          RUSTFLAGS: "-D warnings -C target-feature=+aes,+sse2"
        run: cargo check --features cli

      - name: Run clippy
        env:
          RUSTFLAGS: "-D warnings -C target-feature=+aes,+sse2"
        run: cargo clippy --all-targets --features cli

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release)')
      || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  markdown_link_check:
    name: Markdown Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release)')
      || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # 429 (rate limited) does not prove a link is broken; a dead
          # link returns 404/410.
          args: >-
            --no-progress
            --exclude-loopback
            --accept '200..=299,429'
            --max-retries 2
            --retry-wait-time 5
            './**/*.md'
          fail: true

  # Build base: version discovery and worktree packing.
  # Skip release commits on branch pushes — the tag push handles the release build.
  build_base:
    name: Build Base
    runs-on: ubuntu-latest
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release)')
      || startsWith(github.ref, 'refs/tags/')
    outputs:
      VERSION: ${{ env.VERSION }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-06-15

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        shell: bash -ex {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Tool versions
        shell: bash -ex {0}
        run: |
          rustc --version
          cargo --version
          protoc --version

      - name: Initialize Environment
        shell: bash -exu -o pipefail {0}
        run: |
          git fetch origin
          git fetch origin --tags --force

          # Version from Git repository (tag-commit)
          VERSION="$(git describe --tags --always)"
          # Strip tag prefix for clean version string
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Pack Working Tree
        shell: bash -ex {0}
        run: tar -H posix -czf /tmp/rust-client-worktree.tar.gz .

      - name: Save Working Tree
        uses: actions/upload-artifact@v4
        with:
          name: rust-client-worktree
          path: /tmp/rust-client-worktree.tar.gz

  # Build on both architectures. Verifies CLI and library compilation.
  build:
    name: Build (${{ matrix.arch }})
    needs: build_base
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            rustflags: "-C target-feature=+aes,+sse2"
          - runner: ubuntu-24.04-arm
            arch: arm64
            rustflags: "-C target-feature=+aes,+neon"
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-06-15

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        shell: bash -ex {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Load Working Tree
        uses: actions/download-artifact@v4
        with:
          name: rust-client-worktree
          path: /tmp

      - name: Restore Working Tree
        shell: bash -ex {0}
        run: tar -H posix -xzf /tmp/rust-client-worktree.tar.gz

      - name: Build CLI
        shell: bash -ex {0}
        run: cargo build --release

      - name: Build Library (no default features)
        shell: bash -ex {0}
        run: cargo build --release --no-default-features

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-client-binary-${{ matrix.arch }}
          path: target/release/node_cli

  # Unit tests (offline — no node required).
  unit_tests:
    name: Unit Tests (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            rustflags: "-C target-feature=+aes,+sse2"
          - runner: ubuntu-24.04-arm
            arch: arm64
            rustflags: "-C target-feature=+aes,+neon"
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-06-15

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        shell: bash -ex {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Load Working Tree
        uses: actions/download-artifact@v4
        with:
          name: rust-client-worktree
          path: /tmp

      - name: Restore Working Tree
        shell: bash -ex {0}
        run: tar -H posix -xzf /tmp/rust-client-worktree.tar.gz

      - name: Run Unit Tests
        shell: bash -ex {0}
        env:
          RUST_BACKTRACE: "1"
        run: |
          mkdir -p /tmp/test-logs
          cargo test --release 2>&1 | tee /tmp/test-logs/unit-test-output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          exit $TEST_EXIT_CODE

      - name: Upload Test Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs-${{ matrix.arch }}
          path: /tmp/test-logs/
          retention-days: 7

  # The node-backed suite. It owns its shard: bootstrap, three validators, a
  # read-only observer and a joiner, all defined in tests/integration/topology.
  integration_tests:
    name: Integration Tests (${{ matrix.arch.name }})
    needs:
      - build_base
      - unit_tests
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { runner: ubuntu-latest, name: amd64, rustflags: "-C target-feature=+aes,+sse2" }
          - { runner: ubuntu-24.04-arm, name: arm64, rustflags: "-C target-feature=+aes,+neon" }
    env:
      RUSTFLAGS: ${{ matrix.arch.rustflags }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-06-15

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install protobuf compiler
        shell: bash -ex {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Load Working Tree
        uses: actions/download-artifact@v4
        with:
          name: rust-client-worktree
          path: /tmp

      - name: Restore Working Tree
        shell: bash -ex {0}
        run: tar -H posix -xzf /tmp/rust-client-worktree.tar.gz

      # The harness pulls the image, records its digest, brings the shard up
      # and tears it down, so there is nothing to start or stop here.
      - name: Run Integration Tests
        shell: bash -ex {0}
        timeout-minutes: 25
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --release --features integration --test integration

      - name: Upload Container Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ matrix.arch.name }}
          path: target/integration-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear the shard down
        if: always()
        shell: bash {0}
        run: |
          docker compose -p rust-client-it \
            -f tests/integration/topology/compose.yml \
            --profile joiner down -v --remove-orphans || true

  # GitHub Release with compiled binaries and changelog.
  release_packages:
    name: Release Packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs:
      - integration_tests
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for CHANGELOG.md)
        uses: actions/checkout@v4

      - name: Load amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: rust-client-binary-amd64
          path: /tmp/amd64

      - name: Load arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: rust-client-binary-arm64
          path: /tmp/arm64

      - name: Prepare release artifacts
        shell: bash -ex {0}
        run: |
          mkdir -p /tmp/release
          cp /tmp/amd64/node_cli /tmp/release/rust-client-linux-amd64
          cp /tmp/arm64/node_cli /tmp/release/rust-client-linux-arm64
          chmod +x /tmp/release/rust-client-linux-amd64
          chmod +x /tmp/release/rust-client-linux-arm64

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: /tmp/release/*
          prerelease: false
          draft: false
          allowUpdates: true
          omitBodyDuringUpdate: true
          bodyFile: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
