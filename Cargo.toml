[package]
name = "node_cli"
version = "0.2.7"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:ratatui", "dep:crossterm", "dep:tracing-subscriber", "dep:toml"]
# Gates the node-backed suite. Without it `cargo test --test integration`
# fails rather than skipping, so the suite cannot pass by not running.
integration = []

[[bin]]
name = "node_cli"
required-features = ["cli"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"
harness = false
required-features = ["cli", "integration"]

[[test]]
name = "transfer_reports"
required-features = ["cli"]

[dependencies]
num-bigint = "0.4"
# F1r3fly protocol types, pinned to the f1r3node-rust dev commit the
# integration suite's node image is built from.
f1r3fly-models = { package = "models", git = "https://github.com/F1R3FLY-io/f1r3node-rust.git", rev = "252a86d1dcf5ebffc0c39d17614c1256df9c3a22" }
f1r3fly-shared = { package = "shared", git = "https://github.com/F1R3FLY-io/f1r3node-rust.git", rev = "252a86d1dcf5ebffc0c39d17614c1256df9c3a22" }
f1r3fly-crypto = { package = "crypto", git = "https://github.com/F1R3FLY-io/f1r3node-rust.git", rev = "252a86d1dcf5ebffc0c39d17614c1256df9c3a22" }
f1r3fly-rholang = { package = "rholang", git = "https://github.com/F1R3FLY-io/f1r3node-rust.git", rev = "252a86d1dcf5ebffc0c39d17614c1256df9c3a22" }
prost = "0.14"

# gRPC
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Crypto
secp256k1 = { version = "0.31", features = ["rand"] }
blake2 = "0.10.6"
rand = "0.8.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
bs58 = "0.5.0"

# Networking
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = "0.3"

# Hashing
sha3 = "0.10.8"
sha2 = "0.10.8"
typenum = "1.16.0"

# Library modules
chrono = "0.4"
log = "0.4"
tracing = "0.1"
thiserror = "2.0"
crc = "3"
zbase32 = "0.1"

# CLI-only (behind "cli" feature)
clap = { version = "4.4.6", features = ["derive", "env", "string"], optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
toml = { version = "0.8", optional = true }

[dev-dependencies]
libtest-mimic = "0.8.2"
rcgen = "0.13"
