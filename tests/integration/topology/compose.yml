# Shard the integration suite runs against: a ceremony bootstrap that is not a
# validator, three genesis validators, a read-only observer, a TLS proxy in
# front of validator1, and a fourth validator held behind the `joiner` profile
# for the bonding tests.
#
# Every key is generated per run. The harness writes the genesis files, each
# node's config with its validator key, the bootstrap's TLS key and the proxy's
# certificate into IT_SHARD_DIR, and the bootstrap's node ID into
# IT_BOOT_NODE_ID; both are in $IT_SHARD_DIR/shard.env. To debug a failing
# suite by hand, after a harness run:
#   docker compose --env-file target/integration-shard/shard.env \
#     -f tests/integration/topology/compose.yml up -d
#
# Node state lives in the container layer: the shard is created and destroyed
# per run, so nothing here is meant to survive `down`.
#
# Host ports 40400-40462 must be free, so a shard from another project on
# 404xx must be down first.

name: rust-client-it

x-node: &node
  image: ${FIREFLY_NODE_IMAGE:-f1r3flyindustries/f1r3fly-rust:dev}
  user: root
  networks: [shard]
  environment:
    - RUST_LOG
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: "2"

x-bootstrap: &bootstrap --bootstrap=rnode://${IT_BOOT_NODE_ID:?set by the harness in shard.env}@it-boot?protocol=40400&discovery=40404

services:
  # Runs the genesis ceremony. Its key is absent from bonds.txt, so it never
  # proposes, and a deploy sent here is never included (f1r3node-rust#427).
  boot:
    <<: *node
    container_name: it-boot
    command:
      - run
      - --data-dir=/var/lib/f1r3fly
      - --config-file=/var/lib/f1r3fly/node.conf
      - --host=it-boot
      - *bootstrap
      - --allow-private-addresses
      - --required-signatures
      - "2"
      - --ceremony-master-mode
      - --heartbeat-disabled
    ports:
      - "40400:40400"
      - "40401:40401"
      - "40402:40402"
      - "40403:40403"
    volumes:
      # Every other node dials the node ID derived from this key, so the
      # bootstrap's identity is set by the harness rather than at startup.
      - ${IT_SHARD_DIR:?set by the harness in shard.env}/bootstrap/node.key.pem:/var/lib/f1r3fly/node.key.pem:ro
      - ${IT_SHARD_DIR}/conf/boot.conf:/var/lib/f1r3fly/node.conf:ro
      - ${IT_SHARD_DIR}/genesis/bonds.txt:/var/lib/f1r3fly/genesis/bonds.txt:ro
      - ${IT_SHARD_DIR}/genesis/wallets.txt:/var/lib/f1r3fly/genesis/wallets.txt:ro

  validator1:
    <<: *node
    container_name: it-validator1
    depends_on: [boot]
    command:
      - run
      - --data-dir=/var/lib/f1r3fly
      - --config-file=/var/lib/f1r3fly/node.conf
      - --host=it-validator1
      - *bootstrap
      - --allow-private-addresses
      - --genesis-validator
    ports:
      - "40410:40400"
      - "40411:40401"
      - "40412:40402"
      - "40413:40403"
    volumes:
      - ${IT_SHARD_DIR}/conf/validator1.conf:/var/lib/f1r3fly/node.conf:ro
      - ${IT_SHARD_DIR}/genesis/bonds.txt:/var/lib/f1r3fly/genesis/bonds.txt:ro
      - ${IT_SHARD_DIR}/genesis/wallets.txt:/var/lib/f1r3fly/genesis/wallets.txt:ro

  validator2:
    <<: *node
    container_name: it-validator2
    depends_on: [boot]
    command:
      - run
      - --data-dir=/var/lib/f1r3fly
      - --config-file=/var/lib/f1r3fly/node.conf
      - --host=it-validator2
      - *bootstrap
      - --allow-private-addresses
      - --genesis-validator
    ports:
      - "40420:40400"
      - "40421:40401"
      - "40422:40402"
      - "40423:40403"
    volumes:
      - ${IT_SHARD_DIR}/conf/validator2.conf:/var/lib/f1r3fly/node.conf:ro
      - ${IT_SHARD_DIR}/genesis/bonds.txt:/var/lib/f1r3fly/genesis/bonds.txt:ro
      - ${IT_SHARD_DIR}/genesis/wallets.txt:/var/lib/f1r3fly/genesis/wallets.txt:ro

  validator3:
    <<: *node
    container_name: it-validator3
    depends_on: [boot]
    command:
      - run
      - --data-dir=/var/lib/f1r3fly
      - --config-file=/var/lib/f1r3fly/node.conf
      - --host=it-validator3
      - *bootstrap
      - --allow-private-addresses
      - --genesis-validator
    ports:
      - "40430:40400"
      - "40431:40401"
      - "40432:40402"
      - "40433:40403"
    volumes:
      - ${IT_SHARD_DIR}/conf/validator3.conf:/var/lib/f1r3fly/node.conf:ro
      - ${IT_SHARD_DIR}/genesis/bonds.txt:/var/lib/f1r3fly/genesis/bonds.txt:ro
      - ${IT_SHARD_DIR}/genesis/wallets.txt:/var/lib/f1r3fly/genesis/wallets.txt:ro

  # The only node that serves exploratory deploys, and the one the client's
  # --observer flag points at.
  readonly:
    <<: *node
    container_name: it-readonly
    depends_on: [boot]
    command:
      - run
      - --data-dir=/var/lib/f1r3fly
      - --config-file=/var/lib/f1r3fly/node.conf
      - --host=it-readonly
      - *bootstrap
      - --allow-private-addresses
      - --heartbeat-disabled
    ports:
      - "40450:40400"
      - "40451:40401"
      - "40452:40402"
      - "40453:40403"
    volumes:
      - ./node.conf:/var/lib/f1r3fly/node.conf:ro
      - ${IT_SHARD_DIR}/genesis/bonds.txt:/var/lib/f1r3fly/genesis/bonds.txt:ro
      - ${IT_SHARD_DIR}/genesis/wallets.txt:/var/lib/f1r3fly/genesis/wallets.txt:ro

  # Unbonded at genesis; started by the bonding tests.
  validator4:
    <<: *node
    container_name: it-validator4
    profiles: [joiner]
    command:
      - run
      - --data-dir=/var/lib/f1r3fly
      - --config-file=/var/lib/f1r3fly/node.conf
      - --host=it-validator4
      - *bootstrap
      - --allow-private-addresses
    ports:
      - "40440:40400"
      - "40441:40401"
      - "40442:40402"
      - "40443:40403"
    volumes:
      - ${IT_SHARD_DIR}/conf/validator4.conf:/var/lib/f1r3fly/node.conf:ro
      - ${IT_SHARD_DIR}/genesis/bonds.txt:/var/lib/f1r3fly/genesis/bonds.txt:ro
      - ${IT_SHARD_DIR}/genesis/wallets.txt:/var/lib/f1r3fly/genesis/wallets.txt:ro

  # Terminates TLS for validator1's gRPC (40460) and HTTP (40461) APIs, and
  # serves the HTTP API under /node1 on 40462, with a certificate the harness
  # issues per run.
  tls-proxy:
    image: caddy:2.10-alpine
    container_name: it-tls-proxy
    networks: [shard]
    depends_on: [validator1]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${IT_SHARD_DIR}/tls:/tls:ro
    ports:
      - "40460:40460"
      - "40461:40461"
      - "40462:40462"

networks:
  shard:
