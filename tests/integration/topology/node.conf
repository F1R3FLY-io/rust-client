# Overrides merged on top of the node's built-in defaults. Per-role behaviour
# comes from CLI flags in compose.yml, not from here.

casper {
  fault-tolerance-threshold = 0.1

  # max-parent-depth is both the parent-spread validity bound and the deploy
  # lifecycle's citability horizon: a terminal Expired or Failed verdict is
  # written only once the finalized floor passes the deploy's window end plus
  # this many blocks. The node default of 100 would put those verdicts out of
  # reach of a suite that runs for minutes.
  max-parent-depth = 15
  deploy-lifespan = 20

  # Node defaults, kept deliberately. A faster cadence makes every validator
  # propose on nearly every tick, and the resulting empty-block merge load has
  # driven multi-gigabyte allocation spikes on shards this size.
  heartbeat {
    check-interval = 5 seconds
    max-lfb-age = 5 seconds
    self-propose-cooldown = 3 seconds
  }

  genesis-ceremony {
    required-signatures = 2
    approve-interval = 10 seconds
  }

  genesis-block-data {
    # The active set is capped at this number, and the bonding tests assert
    # that the joiner activates — so the cap must not bind.
    number-of-active-validators = 10000
    # Short enough that a bond, an unbond and a payout each cross a boundary
    # within one test.
    epoch-length = 4
    quarantine-length = 10
    bond-minimum = 100
  }
}

logging {
  filter = "info,tonic=error,hyper=error,tower=error,reqwest=error,heed=error,h2=error"
  format = "json"
  sink = "both"
}
